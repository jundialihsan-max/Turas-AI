<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="50%" stop-color="#022C22" />
      <stop offset="100%" stop-color="#0B1320" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>
  </defs>
  <!-- Background with safe zone -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" />
  
  <!-- Subtle Islamic 8-pointed star rosette pattern in background -->
  <g opacity="0.12" stroke="#FDE68A" stroke-width="2" fill="none">
    <rect x="136" y="136" width="240" height="240" transform="rotate(0 256 256)" />
    <rect x="136" y="136" width="240" height="240" transform="rotate(45 256 256)" />
    <circle cx="256" cy="256" r="140" />
    <circle cx="256" cy="256" r="170" />
  </g>

  <!-- Islamic Arch / Mihrab Frame -->
  <path d="M 166 370 L 166 230 C 166 170 210 130 256 110 C 302 130 346 170 346 230 L 346 370 Z" 
        fill="none" stroke="url(#goldGrad)" stroke-width="3.5" opacity="0.4" />

  <!-- Open Quran / Book Symbol -->
  <g transform="translate(256, 260)">
    <!-- Book Spine Glow -->
    <path d="M 0 -70 C -12 -50 -70 -46 -115 -62 C -118 -63 -120 -60 -120 -57 L -120 48 C -120 51 -117 54 -114 55 C -70 70 -12 66 0 46 C 12 66 70 70 114 55 C 117 54 120 51 120 48 L 120 -57 C 120 -60 118 -63 -115 -62 C -70 -46 -12 -50 0 -70 Z" 
          fill="#064E3B" stroke="url(#goldGrad)" stroke-width="4.5" />
    
    <!-- Left Pages Lines -->
    <path d="M -20 -40 C -45 -34 -85 -36 -105 -46" stroke="#FDE68A" stroke-width="2.5" stroke-linecap="round" opacity="0.75" />
    <path d="M -20 -15 C -45 -9 -85 -11 -105 -21" stroke="#FDE68A" stroke-width="2.5" stroke-linecap="round" opacity="0.75" />
    <path d="M -20 10 C -45 16 -85 14 -105 4" stroke="#FDE68A" stroke-width="2.5" stroke-linecap="round" opacity="0.75" />
    <path d="M -20 35 C -45 41 -85 39 -105 29" stroke="#FDE68A" stroke-width="2.5" stroke-linecap="round" opacity="0.75" />

    <!-- Right Pages Lines -->
    <path d="M 20 -40 C 45 -34 85 -36 105 -46" stroke="#FDE68A" stroke-width="2.5" stroke-linecap="round" opacity="0.75" />
    <path d="M 20 -15 C 45 -9 85 -11 105 -21" stroke="#FDE68A" stroke-width="2.5" stroke-linecap="round" opacity="0.75" />
    <path d="M 20 10 C 45 16 85 14 105 4" stroke="#FDE68A" stroke-width="2.5" stroke-linecap="round" opacity="0.75" />
    <path d="M 20 35 C 45 41 85 39 105 29" stroke="#FDE68A" stroke-width="2.5" stroke-linecap="round" opacity="0.75" />

    <!-- Center Bookmark Ribbon -->
    <path d="M 0 -68 L 0 78 L -8 70 L -16 78 L -16 -68" fill="url(#goldGrad)" />

    <!-- Star / Rub el Hizb at Top Center -->
    <g transform="translate(0, -96) scale(0.6)">
      <rect x="-14" y="-14" width="28" height="28" fill="url(#goldGrad)" />
      <rect x="-14" y="-14" width="28" height="28" fill="url(#goldGrad)" transform="rotate(45)" />
      <circle cx="0" cy="0" r="4" fill="#022C22" />
    </g>
  </g>
</svg>
